name = "NavierStokesAndEuler"
version = "0.1.0"
defaultTargets = ["NavierStokes", "GoalSpec", "Checkpoint"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[require]]
name = "Comparator"
scope = "leanprover"
git = "https://github.com/leanprover/comparator.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "NavierStokes"
globs = ["NavierStokes.+"]

[[lean_lib]]
name = "GoalSpec"

[[lean_lib]]
name = "PrivateFullChallenge"

[[lean_lib]]
name = "Branch"
globs = ["Branch.+"]

[[lean_lib]]
name = "Checkpoint"
globs = ["Checkpoint.+"]
