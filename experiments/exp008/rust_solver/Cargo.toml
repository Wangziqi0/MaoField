[package]
name = "exp008_solver"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }

[[bin]]
name = "exp008"
path = "src/main.rs"

[[bin]]
name = "exp008b"
path = "src/exp008b.rs"

[[bin]]
name = "exp009"
path = "src/exp009.rs"

[[bin]]
name = "exp010"
path = "src/exp010.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
