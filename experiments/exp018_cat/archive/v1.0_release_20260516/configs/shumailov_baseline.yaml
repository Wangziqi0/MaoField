# shumailov_baseline.yaml
#
# 严格按 Shumailov et al. (2024) Nature 631:755-759 + arXiv:2305.17493 v3
# Section 5.2 "Language Models" 的 setup 复现自迭代崩溃 baseline.
#
# 来源逐行 cite:
#   "We fine-tune the OPT-125m causal language model made available by Meta
#    through Huggingface [Zhang et al., 2022]." — §5.2
#   "We fine-tune the model on the wikitext2 dataset." — §5.2
#   "For data generation from the trained models we use a 5-way beam-search." — §5.2
#   "We block training sequences to be 64 tokens long; then for each token
#    sequence in the training set, we ask the model to predict the next 64 tokens." — §5.2
#   "We go through all of the original training dataset and produce an
#    artificial dataset of the same size." — §5.2
#   "Each experiment is ran 5 times and the results are shown as 5 separate runs." — §5.2
#   "5 epochs, no original training data ... 10 epochs, 10% of original training data preserved" — §5.2
#   Figure 10 caption: "model 1 was trained on the data produced by model 0;
#    model 2 was trained on data ..." 实际曲线延伸到 Generation 9 (见 Figure 11).
#
# Pre-registered prediction (一凡 + Linux 姐姐 + Win 姐姐 共同 commit):
#   - condition_no_preserve, generation 0 (real wikitext2 训练): perplexity ≈ 20-34
#     (paper: zero-shot baseline 115, fine-tune 后 mean perplexity 34;
#      ‘5 epochs, no original training data’ 条件下 generation 0 报 ~20)
#   - condition_no_preserve, generation 9: perplexity ≈ 28-50
#     (paper §5.2 文字: "from 20 to 28 perplexity points"; Figure 10(a) 显示
#      末尾代有显著上行)
#   - condition_preserve_10pct, generation 9: 显著优于 no_preserve 但仍微升
#     (paper: "minor degradation of performance")
#
# Falsification criterion (binary):
#   - F1: 若 condition_no_preserve generation 9 perplexity < generation 0 perplexity + 5,
#         则 baseline 自迭代崩溃 **未复现**, 反 Shumailov 2024, 整套 reference baseline 失败.
#   - F2: 若 condition_no_preserve 末代 perplexity 不显著 (Welch t-test p > 0.05) 高于
#         condition_preserve_10pct 末代 perplexity, 则 "10% original 数据保留缓解崩溃" 没复现.
#   - F3: 若 generation 0 (real wikitext2) perplexity > 50, 则 fine-tune setup 本身有问题
#         (paper baseline 为 34), 必须先 debug 才能继续后续代.

experiment:
  name: shumailov_baseline
  paper_cite: "Shumailov et al. 2024 Nature 631:755-759 / arXiv:2305.17493v3"
  goal: "复现 OPT-125m 在 wikitext2 上 9 代自迭代后的 perplexity 漂移曲线"

# ---------- Model ----------
model:
  hf_id: "facebook/opt-125m"
  # paper 严格 cite: "OPT-125m causal language model" — §5.2
  # OPT-125m 架构 (Zhang et al. 2022, OPT paper Table 1):
  #   layers: 12, hidden dim: 768, attention heads: 12, ~125M params
  #   注: 一凡 README 主 arm 用 GPT-2 base (124M), 此 baseline 严格按 paper 用 OPT-125m
  #   (二者参数量级一致, 但架构 + tokenizer 不同, 不可互换)
  dtype: "float16"     # GPU memory binding (RX 9070 XT 16GB, 已被 llama-server 占 10.4GB)
                       # paper 未明示 fp16/fp32 [paper 未明示, sub-agent 默认 fp16 因为 RX 9070 XT 单卡 5.6GB 可用]
  cache_dir: "data/checkpoints/hf_cache"

# ---------- Dataset ----------
dataset:
  hf_id: "wikitext"
  hf_config: "wikitext-2-raw-v1"
  # paper 严格 cite: "wikitext2 dataset" — §5.2 (raw 还是 v1 paper 未明示;
  # [paper 未明示, sub-agent 默认 wikitext-2-raw-v1 — HF datasets 标准 raw 版,
  #  与 OPT-125m pretrain 时 BPE tokenizer 兼容性最高])
  block_size: 64
  # paper 严格 cite: "We block training sequences to be 64 tokens long" — §5.2
  splits:
    train: "train"
    validation: "validation"
    test: "test"
  cache_dir: "data/datasets"

# ---------- Fine-tune (per generation) ----------
fine_tune:
  # paper 严格 cite 项:
  #   "We block training sequences to be 64 tokens long" → block_size = 64
  #   "5 epochs" (no_preserve) / "10 epochs" (preserve_10pct)
  # paper 未明示项 (sub-agent 默认值, 在 README falsification §3 注明):
  #   optimizer: AdamW [paper 未明示, sub-agent 默认 AdamW — HF Trainer 默认]
  #   learning_rate: 2e-5 [paper 未明示, sub-agent 默认 2e-5 —
  #                        OPT 原始 fine-tune script (huggingface/transformers
  #                        examples/pytorch/language-modeling/run_clm.py) default]
  #   batch_size: 8 [paper 未明示, sub-agent 默认 8 — RX 9070 XT 16GB FP16 + block_size=64
  #                  实测可承载 (估算 OPT-125m fp16 ~250MB 权重 + adamw state ~500MB +
  #                  activation 8 × 64 × 768 × 12 fp16 ~5MB + buffer ~3GB)]
  #   gradient_accumulation_steps: 4 [paper 未明示, effective batch = 32]
  #   weight_decay: 0.01 [HF Trainer default]
  #   warmup_ratio: 0.0 [paper 未明示, fine-tune 短跑不 warmup]
  #   lr_scheduler_type: linear [HF Trainer default]
  optimizer: "adamw_torch"
  learning_rate: 2.0e-5
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  weight_decay: 0.01
  warmup_ratio: 0.0
  lr_scheduler_type: "linear"
  fp16: true                  # RX 9070 XT ROCm 支持
  gradient_checkpointing: false   # OPT-125m 小, 关掉省时间; OOM 才打开
  save_strategy: "no"         # 中间代不存 checkpoint, 只存 final 给下代用
  evaluation_strategy: "epoch"
  logging_steps: 50
  seed: null                  # 由 CLI --seed 注入

# ---------- Generation (synthetic data for next generation) ----------
generation:
  strategy: "beam_search"
  num_beams: 5
  # paper 严格 cite: "5-way beam-search" — §5.2
  do_sample: false
  prompt_length: 64
  max_new_tokens: 64
  # paper 严格 cite: "for each token sequence in the training set, we ask
  #  the model to predict the next 64 tokens" — §5.2
  per_device_generation_batch_size: 32
  # paper 严格 cite: "We go through all of the original training dataset and
  #  produce an artificial dataset of the same size." — §5.2
  output_size: "match_original"   # 约 36k blocks (wikitext-2 train 块数)

# ---------- Self-iteration ----------
self_iteration:
  num_generations: 10           # generation 0..9 (10 个 model)
  # paper 严格 cite: Figure 11 explicit 列 Generation 0/1/2/3/5/9 → 至少跑 10 代.
  # 我们 keep all 10 代 (0..9) 与 paper Figure 10/11 一致.

  # paper 给 2 个 condition (Section 5.2 末段):
  conditions:
    - name: "no_preserve"
      epochs_per_generation: 5
      # paper 严格 cite: "5 epochs, no original training data" — §5.2 末段
      original_data_fraction: 0.0
      synthetic_data_fraction: 1.0
      # paper 严格 cite: "no original training data" — §5.2 末段
    - name: "preserve_10pct"
      epochs_per_generation: 10
      # paper 严格 cite: "10 epochs" — §5.2 末段
      original_data_fraction: 0.10
      synthetic_data_fraction: 0.90
      # paper 严格 cite: "every new generation of training, a random 10% of
      #  the original data points are sampled" — §5.2 末段

  # paper 严格 cite: "Training for each of the generations starts with
  #  generation from the original training data." — §5.2
  # 含义: 每代 fine-tune 都从 generation 0 (real wikitext2 训练得的 best model)
  #       重新出发, 不在前一代 checkpoint 上 continue.
  base_model_for_each_generation: "generation_0_best"
  # paper 严格 cite: "to be as realistic as possible, we use the best
  #  performing model on the original task, evaluated using the original
  #  wikitext2 validation set, as the base model for the subsequent generations"
  base_model_selection_metric: "validation_perplexity_on_wikitext2_val"

# ---------- Metrics ----------
metrics:
  perplexity:
    eval_set: "wikitext2_test"
    # paper 严格 cite: "Performance of OPT-125m models of different generations
    #  evaluated using the original wikitext2 test dataset." — Figure 10 caption
    block_size: 64
  per_sequence_perplexity_histogram:
    # paper Figure 11: histogram of per-sequence perplexity, evaluated by
    #  the very first model (generation 0) trained on real data.
    eval_with: "generation_0_model"
    bins: 50
  distinct_n:
    # paper 没用 distinct-n, sub-agent 加上 — mode coverage proxy.
    # [paper 未明示, sub-agent 加上理由: 仅 perplexity 看不到 mode collapse 的
    #  词汇分布坍缩, distinct-1 / distinct-2 是 fact 层信号]
    n: [1, 2, 3]
    sample_size: 5000

# ---------- Multi-seed ----------
multi_seed:
  seeds: [42, 1337, 2024]
  # paper 严格 cite: "Each experiment is ran 5 times" — §5.2
  # sub-agent 默认 3 seed (而非 paper 的 5 seed) — 时间预算理由 (一凡 24 天):
  #   5 seed × 10 generation × (~25 min fine-tune + ~15 min generate)
  #   = ~33 GPU-hour; 改 3 seed → ~20 GPU-hour, 节省 ~13h.
  # bootstrap CI 在 metric.py 里独立加 (n_bootstrap=1000), 弥补 seed 减少.

# ---------- Logging ----------
logging:
  log_dir: "logs"
  jsonl_per_run: "logs/shumailov_<condition>_seed<seed>_<timestamp>.jsonl"
  use_wandb: false
  use_tensorboard: false
