# cat_arm_b_v1_0_release_20260519.yaml
#
# v1.0 release configuration (2026-05-19).
# Aligns all hyperparameters with the **post-hoc multi-seed N=4 fit**
# m_eff = 0.300 ± 0.066 (from 4 strict-mirror baseline runs analyzed via
# scripts/m_eff_direct_fit.py and literature/fit_m_eff_js_multiseed_20260513.py).
#
# Yifan 5/19 binding: "All configs align with m_eff=0.300"
#
# ---------------------------------------------------------------------------
# HONEST DISCLOSE — chain historical vs v1.0 release alignment
# ---------------------------------------------------------------------------
# The chain runs that produced logs/armb_alpha{0,10}_seed{0..4}_*.jsonl
# (5/10-5/12) used cat_arm_b.yaml, in which the YAML omits the `m_eff` key.
# In that case CATConfig at train_one_generation.py:54 falls through to its
# dataclass default `m_eff: 1.0`. Therefore the Volterra kernel
#     χ(k) = exp(-m_eff · k)
# in the metric-only accumulator decays with m_eff = 1.0 in those logs.
#
# The lambda_i, beta_kl, beta_model values written in cat_arm_b.yaml
# (lambda_1=lambda_2=lambda_3=1.0, beta_kl=0.9, beta_model=0.999) are
# the "old framework" Klein-Gordon-free defaults (Tarvainen & Valpola 2017
# mean-teacher style). They were used **as is** by the chain — there was
# no Klein-Gordon m_eff propagation in the running training loss.
#
# v1.0 release alignment (this file) writes the post-hoc fit m_eff = 0.300
# into the YAML explicitly so that:
#   1. Re-runs starting 5/19 propagate the m_eff = 0.300 value through
#      lambda_i, beta_kl, beta_model and the χ kernel.
#   2. The paper's "m_eff = 0.300" claim has a corresponding YAML on disk
#      (no hidden code-vs-paper drift).
#   3. Historical chain logs retain their original m_eff = 1.0 semantics
#      and are not silently relabeled.
#
# Discipline 3 (CLAUDE.md): code form has priority over paper form.
# The fact that historical chain used m_eff = 1.0 (code) while paper analysis
# uses m_eff = 0.300 (post-hoc fit) is itself an empirical surface — it is
# disclosed here, not papered over.
#
# To reproduce the historical chain exactly, use cat_arm_b.yaml.
# To run v1.0 release with paper-aligned hyperparameters, use this file.
# ---------------------------------------------------------------------------

experiment:
  name: cat_arm_b_v1_0_release
  paper_cite: "Shumailov et al. 2024 Nature 631:755-759 / arXiv:2305.17493v3"
  goal: "v1.0 release config. All hyperparameters propagated from m_eff=0.300 post-hoc multi-seed N=4 fit. Historical chain (5/10-5/12) used m_eff=1.0 fallthrough — see disclose header."

# ---------- Model ----------
model:
  hf_id: "facebook/opt-125m"
  dtype: "float16"
  cache_dir: "data/checkpoints/hf_cache"

# ---------- Dataset ----------
dataset:
  hf_id: "wikitext"
  hf_config: "wikitext-2-raw-v1"
  block_size: 64
  splits:
    train: "train"
    validation: "validation"
    test: "test"
  cache_dir: "data/datasets"

# ---------- Fine-tune (per generation) ----------
fine_tune:
  optimizer: "adamw_torch"
  learning_rate: 2.0e-5
  per_device_train_batch_size: 128
  gradient_accumulation_steps: 1
  weight_decay: 0.01
  warmup_ratio: 0.0
  lr_scheduler_type: "constant"
  fp16: true
  gradient_checkpointing: false
  save_strategy: "no"
  evaluation_strategy: "epoch"
  logging_steps: 50
  seed: null

# ---------- Generation ----------
generation:
  strategy: "beam_search"
  num_beams: 5
  do_sample: false
  prompt_length: 64
  max_new_tokens: 64
  per_device_generation_batch_size: 32
  output_size: "match_original"
  repetition_penalty: 3.0

# ---------- Self-iteration ----------
self_iteration:
  num_generations: 10
  conditions:
    - name: "no_preserve"
      epochs_per_generation: 5
      original_data_fraction: 0.0
      synthetic_data_fraction: 1.0
    - name: "preserve_10pct"
      epochs_per_generation: 10
      original_data_fraction: 0.10
      synthetic_data_fraction: 0.90
  base_model_for_each_generation: "generation_0_best"
  base_model_selection_metric: "validation_perplexity_on_wikitext2_val"

# ---------- Metrics ----------
metrics:
  perplexity:
    eval_set: "wikitext2_test"
    block_size: 64
  per_sequence_perplexity_histogram:
    eval_with: "generation_0_model"
    bins: 50
  distinct_n:
    n: [1, 2, 3]
    sample_size: 5000


# ---------- CAT (Contradiction-Aware Training) — v1.0 release ----------
# m_eff = 0.300 ± 0.066 post-hoc multi-seed N=4 fit (5/13 analysis)
#   λ_1 = 1/(2 m_eff)            = 1.6667   (kinetic / velocity coefficient,
#                                              Klein-Gordon Lagrangian form-borrowing)
#   λ_2 = m_eff / 2              = 0.1500   (mass / memory coefficient)
#   λ_3 = m_eff                  = 0.3000   (T_2 outer coefficient, option-β
#                                              with χ(k) = exp(-m_eff·k))
#   β_kl    = exp(-m_eff)            = 0.7408
#   β_model = exp(-m_eff / N_step), N_step=1406 = 0.999787
#
# CAVEAT (must remain in paper §6 and any release notes):
#   - Klein-Gordon λ_i propagation is form-borrowing (Tauber 2014 §4.2),
#     not first-principles derivation. The 25-40% partial isomorphism reading
#     in contradiction_loss.py header still applies.
#   - m_eff = 0.300 has CI ± 0.066 (N=4 seeds, multi-seed bootstrap).
#     Single-seed (seed=42 only) prior fit gave m_eff = 0.212; the N=4 fit
#     supersedes it because variance came largely from fp16 numerical drift.
#   - T_2_form = "quadratic" (symmetric D^2/2) preferred over the older
#     "relu_dpp" (punitive single-side ReLU(D'')). See feasibility verdict
#     literature/feasibility_dialectical_verdict_20260510.md.
#   - kl_history_K = 9 Volterra accumulator is **logged in metrics only**,
#     not yet entered into the training loss form. Entering it requires
#     K-th order chain rule + T_H Markov kernel derivation (deferred to v2.0+).
cat:
  enabled: true
  alpha_scan: [0.0, 1.0, 5.0, 10.0, 20.0]
  kl_update_every: 10
  val_subset_size: 256
  val_max_length: 64
  beta_model: 0.999787              # exp(-0.300/1406), m_eff=0.300 multi-seed N=4 fit
  beta_kl: 0.7408                   # exp(-0.300)
  lambda_1: 1.6667                  # 1/(2 m_eff), Klein-Gordon kinetic (form-borrowing)
  lambda_2: 0.1500                  # m_eff/2, Klein-Gordon mass (form-borrowing)
  lambda_3: 0.3000                  # m_eff, T_2 outer (option-β with χ(k)=exp(-m_eff·k))
  enable_grad_norm_monitor: true
  T_2_form: "quadratic"             # 5/10 dialectical: D^2/2 symmetric
  kl_history_K: 9                   # Volterra path-dependent (metric only, not in loss)
  m_eff: 0.300                      # Post-hoc multi-seed N=4 fit, CI ± 0.066

# Pre-registered prediction (v1.0 release re-run, if any):
#   - α=0.0: equivalent baseline strict-mirror, expect gen0≈36 → gen9≈53.
#   - α=10.0: expect modulation pattern observed in 5/12 multi-seed
#     (-4.2% plateau, U-shape middle-trap + plateau-persist regime).
#   - α=20.0: pushes near numerical break boundary (α=50 broke at 5/9).
#
# Falsification criterion (binary, paper §6):
#   - F4: any α vs α=0 baseline shows no significant collapse mitigation
#     (paired-t p ≥ 0.05) → arm B emergent path empirically falsified.
#   - F5: monotone failure (α=1 helps but α=10 hurts) → ℒ_contradiction unstable.
#   - F6: per-step cost ↑ > 50% → implementation regression.

# ---------- Multi-seed ----------
multi_seed:
  seeds: [0, 1, 2, 3, 4]            # paper convention 5 seeds (5/9 PI ack Option A)

# ---------- Logging ----------
logging:
  log_dir: "logs"
  jsonl_per_run: "logs/armb_v1_0_alpha<alpha>_seed<seed>_<timestamp>.jsonl"
  use_wandb: false
  use_tensorboard: false
