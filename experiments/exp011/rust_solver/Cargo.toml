[package]
name = "exp011_solver"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }

[[bin]]
name = "exp011"
path = "src/main.rs"

[[bin]]
name = "exp011b"
path = "src/exp011b.rs"

[[bin]]
name = "exp012"
path = "src/exp012.rs"

[[bin]]
name = "exp013"
path = "src/exp013.rs"

[[bin]]
name = "exp014"
path = "src/exp014.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
