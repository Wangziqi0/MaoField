[package]
name = "exp006_solver"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = { version = "0.16", features = ["rayon"] }
rusqlite = { version = "0.34", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
target-cpu = "znver3"
