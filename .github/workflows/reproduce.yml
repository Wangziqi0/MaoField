name: Reproduce deterministic checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'REPRODUCIBILITY/**'
      - 'SOURCE_DATA/**'
      - '.github/workflows/reproduce.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: python -m pip install -r REPRODUCIBILITY/requirements-lock.txt
      - name: Reanalyse retained records and exact mathematics
        run: python REPRODUCIBILITY/reproduce.py --out WORK/reproduction
      - name: Check source assembly and visible-record integrity
        run: python -m unittest discover -s REPRODUCIBILITY/tests -v
